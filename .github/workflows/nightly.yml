name: Nightly fetch+push

on:
  schedule:
    # 04:30 UTC = 06:30 MESZ (Sommer) bzw. 05:30 MEZ (Winter) — siehe docs/ci.md.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      market_id:
        description: "Nur diese Filiale syncen (ID aus public.branches); leer = Voll-Sync"
        required: false
        default: ""
      # AUS, und der Zeitplan setzt ihn nie: Ein geplanter Lauf lädt und
      # schreibt weiter genau das, was er vorher geschrieben hat. Anschalten ist
      # eine Handlung, keine Voreinstellung — die Vorschau verdoppelt grob die
      # Zeilen in `offers`. Messung im [[Le Chariot Backlog]], „Phase 0".
      preview:
        description: "Angebote der Folgewoche mitladen (Kaufland, Lidl, ALDI Nord)"
        type: boolean
        required: false
        default: false

concurrency:
  # On-Demand-Läufe für einzelne Filialen dürfen parallel zum Voll-Sync laufen.
  group: nightly-${{ inputs.market_id || 'all' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    runs-on: ubuntu-latest
    # 6+ Regionen mit Bild-Spiegelung + Rust-Build brauchen deutlich mehr als
    # 45 min — die Läufe vom 18.07. wurden bei 45 min abgebrochen.
    timeout-minutes: 150
    env:
      LECHARIOT_ZIP: ${{ vars.LECHARIOT_ZIP }}
      # `secrets` ist in Step-`if` nicht erlaubt — Verfügbarkeit hier als Env-Flag.
      REWE_SECRETS_SET: ${{ secrets.REWE_CERT_PEM != '' && secrets.REWE_KEY_PEM != '' }}
      DB: ${{ github.workspace }}/nightly.db
      LOG: ${{ github.workspace }}/nightly.log
      # Lidl aus dem eigenen Prospekt. Seit dem 2026-07-31 ist das auch der
      # Code-Default — die Zeile steht als Absicht hier, nicht als Schalter.
      # Vorher fiel eine fehlende Variable auf marktguru zurück, und genau
      # daran hing der Fehler: `branches.yml` setzt sie nicht und holte
      # deshalb aus einer anderen Quelle als dieser Lauf.
      LIDL_SOURCE: prospekt
      # Leer bei jedem geplanten Lauf — `inputs.preview` gibt es nur bei
      # workflow_dispatch. `preview::enabled()` liest genau diese Variable.
      LECHARIOT_PREVIEW: ${{ inputs.preview && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Preflight (ZIP variable, curl, sqlite3)
        run: |
          if [ -z "$LECHARIOT_ZIP" ]; then
            echo "::error::Repo-Variable LECHARIOT_ZIP ist nicht gesetzt (Settings -> Variables)."
            exit 1
          fi
          # Netto/ALDI Süd/EDEKA werden über system-curl geholt (Akamai).
          command -v curl >/dev/null || { echo "::error::curl fehlt auf dem Runner."; exit 1; }
          curl --version | head -1
          command -v sqlite3 >/dev/null || { sudo apt-get update && sudo apt-get install -y sqlite3; }
          sqlite3 --version
          # Der Lidl-Prospekt-Scraper (LIDL_SOURCE=prospekt) liest die
          # Textebene der Prospekt-PDF mit pdftotext aus poppler-utils.
          command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
          pdftotext -v 2>&1 | head -1

      # On-Demand-Pfad: vorgebautes Binary aus dem letzten erfolgreichen
      # CI-Lauf auf master laden statt ~6 min zu bauen. Fallback: normaler
      # Build, wenn (noch) kein Artefakt existiert oder es abgelaufen ist.
      - name: Download prebuilt binary (on-demand)
        id: prebuilt
        if: inputs.market_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FOUND=false
          # SICHERHEIT: Nur Artefakte aus Push-Läufen auf master IN DIESEM Repo
          # ausführen. `--branch` filtert nur den Head-Branch-*Namen*, den ein
          # Fork-PR frei wählt (Branch "master" im Fork) — so ein Lauf ist ein
          # `pull_request`-Event aus einem Fremd-Repo. `--event push` schließt
          # PR-Läufe aus (Push auf master braucht hier Schreibrechte), und die
          # head_repository-Prüfung stellt sicher, dass das Binary aus diesem
          # Repository stammt, bevor es im Secrets-Job ausgeführt wird.
          RUN_ID=$(gh run list --workflow ci.yml --branch master --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            HEAD_REPO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
              --jq '.head_repository.full_name' || true)
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::warning::CI-Lauf $RUN_ID stammt nicht aus $GITHUB_REPOSITORY (head_repository=$HEAD_REPO) — ignoriere Artefakt."
              RUN_ID=""
            fi
          fi
          if [ -n "$RUN_ID" ] \
              && gh run download "$RUN_ID" --name lechariot-linux-x86_64 --dir prebuilt \
              && [ -f prebuilt/lechariot ]; then
            mkdir -p target/release
            install -m 0755 prebuilt/lechariot target/release/lechariot
            if ./target/release/lechariot --help >/dev/null 2>&1; then
              echo "Prebuilt Binary aus CI-Lauf $RUN_ID übernommen."
              FOUND=true
            fi
          fi
          [ "$FOUND" = true ] || echo "::warning::Kein brauchbares CI-Artefakt — baue selbst."
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      # prefix-key mit Cratename und bumpbarer Version: nach der Umbenennung
      # smartshop->lechariot haben restaurierte target/-Verzeichnisse zweimal
      # Phantom-Testfehler produziert (26./27.07.2026). Bei erneutem Verdacht
      # auf einen vergifteten Cache: Version hochzaehlen (v1 -> v2).
      - uses: Swatinem/rust-cache@v2
        if: steps.prebuilt.outputs.found != 'true'
        with:
          prefix-key: v1-lechariot

      - name: Build release
        if: steps.prebuilt.outputs.found != 'true'
        run: cargo build --release

      # Rewe-Client-Zertifikat einrichten — nur wenn die Secrets gesetzt sind.
      # Ohne Secrets bleibt REWE_CERT/REWE_KEY leer und der Sync läuft wie
      # bisher ohne Rewe durch (kein Fehler). Die Secrets liegen als PEM oder
      # base64-kodiertes PEM vor (base64 -d schlägt bei Plain-PEM nicht fehl,
      # solange es gültiges base64 ist; wir dekodieren immer und schreiben das
      # Ergebnis — bei Plain-PEM setze base64-kodierte Secrets via `gh secret set`).
      - name: Setup Go (für rewerse)
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup rewerse + Rewe-Zertifikat
        id: rewe
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        env:
          REWE_CERT_PEM: ${{ secrets.REWE_CERT_PEM }}
          REWE_KEY_PEM: ${{ secrets.REWE_KEY_PEM }}
        run: |
          set -euo pipefail
          go install github.com/ByteSizedMarius/rewerse-engineering/cmd@latest
          ln -sf "$(go env GOPATH)/bin/cmd" "$(go env GOPATH)/bin/rewerse"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          CERT="$RUNNER_TEMP/rewe-cert.pem"
          KEY="$RUNNER_TEMP/rewe-private.key"
          printf '%s' "$REWE_CERT_PEM" | base64 -d > "$CERT"
          printf '%s' "$REWE_KEY_PEM"  | base64 -d > "$KEY"
          chmod 600 "$CERT" "$KEY"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Primärpfad: alle aktiven Regionen aus public.regions syncen
      # (fetch + markets-Upsert + push pro PLZ). Rewe wird nur mitgezogen, wenn
      # oben Cert+Key eingerichtet wurden (--cert/--key gesetzt); sonst schlägt
      # Rewe pro Store fehl, das ist dann erwartet.
      # Schlägt der ganze Sync fehl (Tabelle leer/unerreichbar, alle
      # Regionen gescheitert), greift der Fallback-Step unten.
      - name: Sync regions (fetch+push per region)
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REWE_CERT: ${{ steps.rewe.outputs.cert }}
          REWE_KEY: ${{ steps.rewe.outputs.key }}
          ONLY_MARKET: ${{ inputs.market_id }}
        run: |
          set -o pipefail
          CERT_ARGS=()
          [ -n "${REWE_CERT:-}" ] && [ -f "$REWE_CERT" ] && CERT_ARGS+=(--cert "$REWE_CERT")
          [ -n "${REWE_KEY:-}" ] && [ -f "$REWE_KEY" ] && CERT_ARGS+=(--key "$REWE_KEY")
          # On-Demand-Trigger: nur die angeforderte Filiale (branch_requests).
          # Der PLZ-Weg ist mit Migration v16 weg — die App fordert Filialen an.
          ONLY_ARGS=()
          if [ -n "${ONLY_MARKET:-}" ]; then
            ONLY_ARGS+=(--market-id "$ONLY_MARKET")
          fi
          if ./target/release/lechariot sync --db "$DB" \
              ${ONLY_ARGS[@]+"${ONLY_ARGS[@]}"} \
              ${CERT_ARGS[@]+"${CERT_ARGS[@]}"} 2>&1 | tee "$LOG"; then
            echo "sync_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sync_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::sync fehlgeschlagen — Fallback auf Einzel-PLZ $LECHARIOT_ZIP."
          fi

      # Bootstrap-Fallback: Solange noch niemand eine Filiale gewählt hat
      # (frische Datenbank), holt LECHARIOT_ZIP wenigstens eine Gegend, damit
      # die Pipeline nie dunkel geht. Bei On-Demand-Läufen wäre der Fallback
      # die falsche Filiale — dort übernimmt der nächtliche Voll-Sync.
      - name: Fallback fetch+push (single ZIP)
        if: steps.sync.outputs.sync_failed == 'true' && inputs.market_id == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REWE_CERT: ${{ steps.rewe.outputs.cert }}
          REWE_KEY: ${{ steps.rewe.outputs.key }}
        run: |
          set -o pipefail
          CERT_ARGS=()
          [ -n "${REWE_CERT:-}" ] && [ -f "$REWE_CERT" ] && CERT_ARGS+=(--cert "$REWE_CERT")
          [ -n "${REWE_KEY:-}" ] && [ -f "$REWE_KEY" ] && CERT_ARGS+=(--key "$REWE_KEY")
          ./target/release/lechariot fetch --all-stores \
            --zip "$LECHARIOT_ZIP" --db "$DB" \
            ${CERT_ARGS[@]+"${CERT_ARGS[@]}"} 2>&1 | tee -a "$LOG"
          ./target/release/lechariot push --db "$DB" \
            2>&1 | tee -a "$LOG"

      - name: Store summary + zero-offer check
        if: always()
        env:
          # Muss hier eigens gesetzt werden: Der Sync-Schritt hat sein eigenes
          # `env`, und ohne diese Zeile wäre `$ONLY_MARKET` unten leer — die
          # Fallunterscheidung liefe dann nie an, ohne dass etwas fehlschlägt.
          ONLY_MARKET: ${{ inputs.market_id }}
        run: |
          # Übersprungene Filialen zuerst und als Annotation — dieselbe
          # Behandlung wie in branches.yml (#16). Am 31.07.2026 hat ein grüner
          # Lauf drei Lidl-Märkte fallen lassen; die Zeile stand im Log, sah
          # aus wie eine Notiz, und niemand hat sie drei Wochen lang gelesen.
          # Der Doppelpunkt gehört nur der Hälfte der Meldungen: sync.rs
          # schreibt "WARNUNG: …", die Scraper "WARNUNG [EDEKA] …". Ohne den
          # zweiten Schnitt stand das Wort in jeder Scraper-Annotation doppelt.
          while IFS= read -r zeile; do
            zeile="${zeile#WARNUNG: }"
            echo "::warning title=Nightly sync::${zeile#WARNUNG }"
          done < <(grep "^WARNUNG" "$LOG" 2>/dev/null || true)

          warnungen=$(grep -c "^WARNUNG" "$LOG" 2>/dev/null || true)

          {
            echo "## Nightly sync"
            if grep -q "^WARNUNG.*übersprungen" "$LOG" 2>/dev/null; then
              echo ""
              grep "^WARNUNG.*übersprungen" "$LOG" \
                | sed 's/^WARNUNG: /> ⚠️ **/; s/$/**/'
              echo ""
              echo "> Die Zusammenfassung unten ist damit unvollständig."
            fi
            # Jeden "Zusammenfassung"-Block aus dem Log (einer pro Region,
            # bzw. "Zusammenfassung:" im Fallback) in eine Markdown-Tabelle
            # umformen (Spalten sind mit >=2 Leerzeichen getrennt).
            awk '
              /^Zusammenfassung/ {
                title=$0; sub(/:$/, "", title)
                if (title == "Zusammenfassung") title = "Zusammenfassung (Fallback PLZ)"
                print ""
                print "### " title
                print ""
                print "| Markt | Filiale | Ergebnis |"
                print "|---|---|---|"
                inblk=1; header_skipped=0; next
              }
              inblk {
                if ($0 !~ /^  /) { inblk=0; next }
                if (!header_skipped) { header_skipped=1; next }
                line=$0; sub(/^ +/, "", line); gsub(/ {2,}/, " | ", line)
                print "| " line " |"
              }
            ' "$LOG"

            # Alle Warnungen ausschreiben, nicht nur die mit „übersprungen"
            # — dieselbe Liste, die branches.yml seit #16 führt.
            #
            # Der Fall, der sie hier nötig macht: Schlägt die Filialsuche fehl,
            # meldet store_finder „nutze nationalen Platzhalter" und der Lauf
            # geht weiter. In der Tabelle steht dann eine Filiale, die gar
            # nicht die gesuchte ist. Am 30.07. kam der EDEKA-Markt-Redirect
            # für Ahlbeck auf dem Runner zweimal leer zurück (vom Mac
            # antwortet dieselbe URL mit 308 — es ist die Runner-IP an
            # Akamai). Das Wort „übersprungen" steht in dieser Meldung nicht,
            # sie fiel deshalb aus der Zusammenfassung heraus.
            if [ "${warnungen:-0}" -gt 0 ]; then
              echo ""
              echo "### Warnungen ($warnungen)"
              echo ""
              grep "^WARNUNG" "$LOG" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          COUNT=0
          [ -f "$DB" ] && COUNT=$(sqlite3 "$DB" 'SELECT COUNT(*) FROM offers')
          # Der Ertrag des LAUFS, nicht der Reststand einer Datei.
          #
          # `sync.rs` leert `offers` vor **jedem** Filial- und National-Sync
          # (Zeilen 123 und 201). Am Ende steht in der lokalen DB deshalb nur
          # noch, was der letzte Sync geholt hat — am 01.08. waren das 221
          # Zeilen, während 45 Filial-Syncs über acht Ketten hochgeladen hatten.
          # Wer die Zahl als Tagesertrag las, las sie falsch, und sie stand
          # fett unter der Zusammenfassung.
          #
          # Die echte Summe steht im Log: `push.rs` schreibt je Push
          # „Fertig: N Angebote nach Supabase gepusht (…)". Die werden addiert.
          HOCHGELADEN=$(awk '/^Fertig: [0-9]+ Angebote nach Supabase gepusht/ {s+=$2} END {print s+0}' "$LOG" 2>/dev/null || echo 0)
          PUSHES=$(grep -c "^Fertig: .* nach Supabase gepusht" "$LOG" 2>/dev/null || echo 0)
          {
            echo ""
            echo "**$HOCHGELADEN Angebote hochgeladen** (Summe aus $PUSHES Push-Läufen)."
            echo ""
            echo "<sub>In der lokalen DB stehen am Ende $COUNT Zeilen — das ist der"
            echo "letzte Sync, nicht der Lauf: \`sync.rs\` leert die Tabelle vor jedem.</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Null Angebote heißt nicht immer dasselbe. Beim vollen Lauf ist es
          # der Alarm, für den diese Prüfung gebaut wurde: acht Ketten
          # gleichzeitig stumm, dann blockt sehr wahrscheinlich Akamai die
          # Runner-IP. Bei einem Lauf für **eine** Filiale ist es dagegen eine
          # ganz gewöhnliche Auskunft — EDEKA Böse (216653) etwa veröffentlicht
          # auf edeka.de überhaupt keine Angebotsseite, bekannt und behandelt
          # seit #4, und die App sagt es dem Nutzer auch so.
          #
          # Am 2026-07-31 hat genau das einen roten Lauf erzeugt und ihm die
          # falsche Ursache angeheftet: „alle Stores fehlgeschlagen (Akamai)"
          # für einen Markt, der schlicht nichts zu holen hat. Dieselbe Form
          # wie #20/#27/#31 — die Regel beschreibt ihre Klasse richtig und
          # prüft sie zu wörtlich.
          if [ "$COUNT" -eq 0 ]; then
            if [ -n "$ONLY_MARKET" ]; then
              echo "::warning title=Nightly sync::Filiale $ONLY_MARKET lieferte keine Angebote. Das ist kein Fehler des Laufs — diese Filiale veröffentlicht online nichts (oder der Prospekt ist gerade abgelaufen)."
              echo "> ℹ️ **Filiale $ONLY_MARKET veröffentlicht keine Angebote** — der Lauf selbst war in Ordnung." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::0 Angebote in der DB — alle Stores fehlgeschlagen (Akamai blockt evtl. Runner-IPs, siehe docs/ci.md)."
            exit 1
          fi
          echo "$COUNT Angebote in der DB."

      # Verwaiste Bucket-Bilder aufräumen: der Push löscht veraltete offer-Zeilen
      # (push.rs), aber nie ihre gespiegelten Bilder — der offer-images-Bucket
      # wuchs so über das Free-Limit. Nur beim vollen
      # Nightly-Sync (nicht bei On-Demand-Läufen) und nur Objekte älter als
      # 1 Tag: das schützt frisch Gespiegeltes gegen parallel laufende
      # On-Demand-Läufe, die ihre Bilder noch nicht in offers.image_url haben.
      - name: Prune orphaned bucket images
        if: inputs.market_id == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ./target/release/lechariot prune-images --execute --min-age-days 1 \
            2>&1 | tee -a "$LOG"

      # Preis-Historie beschneiden: Anders als `offers` rotiert sie nicht —
      # jeder Push legt eine weitere Wochen-Zeile je Produkt und Filiale an,
      # gelöscht wurde nie. Mit dem Filial-Schlüssel (v13) multipliziert sich
      # das zusätzlich mit jeder angeforderten Filiale. Wie beim Bild-Prune
      # nur im vollen Nightly-Lauf.
      - name: Prune price history
        if: inputs.market_id == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ./target/release/lechariot prune-history --execute \
            2>&1 | tee -a "$LOG"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-log
          path: nightly.log
          if-no-files-found: ignore
          retention-days: 7
# (touch: force GitHub workflow registration)

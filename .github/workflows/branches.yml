name: Filialverzeichnis auffrischen

# Eigener Job neben nightly.yml, mit Absicht: Filialen ändern sich in Monaten,
# Angebote wöchentlich. In der Nightly mitzulaufen würde deren Laufzeit (heute
# schon bis 150 min) jeden Tag um Requests verlängern, die 364 Tage im Jahr
# dasselbe Ergebnis liefern.
on:
  schedule:
    # Sonntags 03:15 UTC — vor dem täglichen Angebots-Sync um 04:30, damit ein
    # neu aufgetauchter Markt am selben Morgen Angebote bekommen kann.
    - cron: "15 3 * * 0"
  workflow_dispatch:
    inputs:
      area:
        description: "Nur dieses Gebiet (PLZ); leer = alle aktiven Regionen"
        required: false
        default: ""
      skip_national:
        description: "Kaufland und Penny überspringen"
        type: boolean
        required: false
        default: false
      # Ab Migration v21. Bewusst OHNE `type: number`: Der Trigger schickt
      # Strings, und einen leeren Standardwert lehnt die Dispatch-API bei einer
      # Zahl ab. Kommt hier eine Eingabe an, die nicht deklariert ist,
      # antwortet GitHub mit 422 — und `trigger_area_scrape` schluckt das in
      # eine Warnung, die niemand liest. Deshalb steht dieser Workflow auf
      # master, bevor die Migration läuft.
      lat:
        description: "Breitengrad des Suchmittelpunkts (leer = aus der PLZ geocodieren)"
        required: false
        default: ""
      lon:
        description: "Längengrad des Suchmittelpunkts"
        required: false
        default: ""
      anchor:
        description: "market_id der area_requests-Zeile, die PLZ und Fertigmeldung bekommt"
        required: false
        default: ""

concurrency:
  # Nach dem Anker gruppieren, wo es einen gibt: Zwei Orte können dieselbe
  # nächste Filiale haben, aber zwei verschiedene Anforderungen dürfen sich
  # nicht gegenseitig in die Warteschlange stellen.
  group: branches-${{ inputs.anchor || inputs.area || 'all' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  branches:
    runs-on: ubuntu-latest
    # Deutlich kürzer als die Nightly: keine Angebote, keine Bilder, nur
    # Filiallisten. Der Löwenanteil sind die Gebietssuchen mit ihren
    # Höflichkeitspausen.
    timeout-minutes: 45
    env:
      REWE_SECRETS_SET: ${{ secrets.REWE_CERT_PEM != '' && secrets.REWE_KEY_PEM != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (curl)
        run: |
          # Netto und EDEKA laufen über system-curl (Akamai).
          command -v curl >/dev/null || { echo "::error::curl fehlt auf dem Runner."; exit 1; }
          curl --version | head -1

      # prefix-key mit Cratename und bumpbarer Version: nach der Umbenennung
      # smartshop->lechariot haben restaurierte target/-Verzeichnisse zweimal
      # Phantom-Testfehler produziert (26./27.07.2026). Bei erneutem Verdacht
      # auf einen vergifteten Cache: Version hochzaehlen (v1 -> v2).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-lechariot

      - name: Build release
        run: cargo build --release

      # REWE braucht ein Client-Zertifikat; ohne Secrets läuft der Lauf ohne
      # REWE durch (Warnung, kein Fehler) — dieselbe Regel wie in nightly.yml.
      - name: Setup Go (für rewerse)
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup rewerse + Rewe-Zertifikat
        id: rewe
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        env:
          REWE_CERT_PEM: ${{ secrets.REWE_CERT_PEM }}
          REWE_KEY_PEM: ${{ secrets.REWE_KEY_PEM }}
        run: |
          set -euo pipefail
          go install github.com/ByteSizedMarius/rewerse-engineering/cmd@latest
          ln -sf "$(go env GOPATH)/bin/cmd" "$(go env GOPATH)/bin/rewerse"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          CERT="$RUNNER_TEMP/rewe-cert.pem"
          KEY="$RUNNER_TEMP/rewe-private.key"
          printf '%s' "$REWE_CERT_PEM" | base64 -d > "$CERT"
          printf '%s' "$REWE_KEY_PEM"  | base64 -d > "$KEY"
          chmod 600 "$CERT" "$KEY"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Filialverzeichnis syncen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REWE_CERT: ${{ steps.rewe.outputs.cert }}
          REWE_KEY: ${{ steps.rewe.outputs.key }}
          ONLY_AREA: ${{ inputs.area }}
          ONLY_LAT: ${{ inputs.lat }}
          ONLY_LON: ${{ inputs.lon }}
          ANCHOR: ${{ inputs.anchor }}
          SKIP_NATIONAL: ${{ inputs.skip_national }}
        run: |
          set -o pipefail
          ARGS=()
          [ -n "${REWE_CERT:-}" ] && [ -f "$REWE_CERT" ] && ARGS+=(--cert "$REWE_CERT")
          [ -n "${REWE_KEY:-}" ] && [ -f "$REWE_KEY" ] && ARGS+=(--key "$REWE_KEY")
          # Ohne explizites Gebiet: die PLZ der gewählten Filialen. Das
          # Verzeichnis wächst dort, wo die App benutzt wird.
          if [ -n "${ONLY_LAT:-}" ] && [ -n "${ONLY_LON:-}" ]; then
            # Der Weg ab v21: Die App hat die Mitte ihrer Region geschickt, die
            # PLZ holt der Lauf per Reverse-Geocoding. `--area` bleibt als
            # Rückfall daneben stehen — schweigt Nominatim, tragen Anker-PLZ
            # und Anker-Stadt die Textsuchen weiter.
            ARGS+=(--lat "$ONLY_LAT" --lon "$ONLY_LON")
            [ -n "${ONLY_AREA:-}" ] && ARGS+=(--area "$ONLY_AREA")
            [ -n "${ANCHOR:-}" ] && ARGS+=(--anchor "$ANCHOR")
          elif [ -n "${ONLY_AREA:-}" ]; then
            ARGS+=(--area "$ONLY_AREA")
          else
            # Sonntagslauf: die Gebiete der gewählten Filialen — plus alles,
            # worauf noch jemand wartet. Der Trigger aus v19 stößt bei jeder
            # Anforderung sofort einen Lauf an, fängt seine Fehler aber ab;
            # ohne dieses Netz bliebe ein verlorener Dispatch für immer offen.
            ARGS+=(--from-branches --from-area-requests)
          fi
          [ "${SKIP_NATIONAL:-false}" = "true" ] && ARGS+=(--skip-national)
          ./target/release/lechariot branches-sync "${ARGS[@]}" 2>&1 | tee branches.log

      - name: Zusammenfassung
        if: always()
        run: |
          # Eine übersprungene Filiale ist stiller Datenverlust: Der Lauf bleibt
          # grün, "13 Filialen geschrieben" liest sich vollständig, und die
          # fehlende steht nirgends. Genau so ist EDEKA Böse in Ahlbeck am
          # 30.07. zweimal durchgefallen (Markt-Redirect leer — von einem Mac
          # antwortet dieselbe URL sofort mit 308, es ist die Runner-IP an
          # Akamai). Deshalb wandert die Zahl NACH OBEN und jede Warnung wird
          # zusätzlich als Annotation ausgegeben: Die steht am Kopf des Laufs,
          # ohne dass jemand die Zusammenfassung aufklappt.
          warnungen=$(grep -c "^WARNUNG" branches.log || true)
          uebersprungen=$(grep -c "^WARNUNG.*übersprungen" branches.log || true)

          # Annotationen zuerst, damit sie auch bei leerem Summary auffallen.
          # Zwei Schreibweisen: sync.rs schreibt "WARNUNG: …", die Scraper
          # "WARNUNG [EDEKA] …". Der Doppelpunkt muss zuerst weg, sonst fängt
          # die Annotation der ersten Sorte mit einem Doppelpunkt an.
          while IFS= read -r zeile; do
            zeile="${zeile#WARNUNG: }"
            echo "::warning title=Filialverzeichnis::${zeile#WARNUNG }"
          done < <(grep "^WARNUNG" branches.log || true)

          {
            echo "## Filialverzeichnis"
            echo ""
            if [ "$uebersprungen" -gt 0 ]; then
              echo "> ⚠️ **$uebersprungen Filiale(n) übersprungen** — die Liste unten ist unvollständig."
              echo ""
            fi
            echo "| Quelle | Ergebnis |"
            echo "|---|---|"
            # Zeilen der Form "[01219] Lidl: 35 Filialen (35 mit Koordinaten)."
            grep -E ": [0-9]+ Filialen" branches.log \
              | sed -E 's/^(.*): ([0-9]+ Filialen.*)$/| \1 | \2 |/' || true
            echo ""
            grep -E "nach Supabase geschrieben" branches.log || echo "_Nichts geschrieben._"
            echo ""
            if [ "$warnungen" -gt 0 ]; then
              echo "### Warnungen ($warnungen)"
              echo ""
              grep "^WARNUNG" branches.log | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branches-log
          path: branches.log
          if-no-files-found: ignore
          retention-days: 7

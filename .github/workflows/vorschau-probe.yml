name: Vorschau-Probe (nur lesen)

# Messgeschirr für Schritt 4 der Vorschau — **nur GET, kein Schreibzugriff**,
# keine Supabase-Secrets, kein Push.
#
# Warum überhaupt in CI: Zwei der drei offenen Ketten sind von einem
# Entwicklungsrechner aus gar nicht messbar. netto-online.de antwortet dieser
# IP mit 403 auf **jede** HTML-Seite (die Wurzel eingeschlossen), und das
# REWE-Clientzertifikat liegt ausschließlich als GitHub-Secret vor. Der
# Runner ist die Umgebung, in der der Scraper wirklich läuft — hier zu messen
# ist also nicht der Umweg, sondern der direkte Weg.
#
# Der Lauf lädt seine Ausgabe als Artefakt hoch. Daraus werden die Fixtures für
# die Offline-Tests; behauptet wird nichts, was hier nicht geantwortet hat.

on:
  workflow_dispatch:
    inputs:
      market:
        description: "REWE-Markt-ID für den -raw-Abruf"
        required: false
        default: "565005"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REWE_SECRETS_SET: ${{ secrets.REWE_CERT_PEM != '' && secrets.REWE_KEY_PEM != '' }}
      OUT: ${{ github.workspace }}/probe
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p "$OUT"

      # ---------------------------------------------------------- REWE
      - name: Setup Go (für rewerse)
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup rewerse + Rewe-Zertifikat
        id: rewe
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        env:
          REWE_CERT_PEM: ${{ secrets.REWE_CERT_PEM }}
          REWE_KEY_PEM: ${{ secrets.REWE_KEY_PEM }}
        run: |
          set -euo pipefail
          go install github.com/ByteSizedMarius/rewerse-engineering/cmd@latest
          ln -sf "$(go env GOPATH)/bin/cmd" "$(go env GOPATH)/bin/rewerse"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          CERT="$RUNNER_TEMP/rewe-cert.pem"
          KEY="$RUNNER_TEMP/rewe-private.key"
          printf '%s' "$REWE_CERT_PEM" | base64 -d > "$CERT"
          printf '%s' "$REWE_KEY_PEM"  | base64 -d > "$KEY"
          chmod 600 "$CERT" "$KEY"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Die eine Frage: Trägt `data.offers.next` wirklich Kategorien mit
      # Preisen — oder sagt der Go-Client das nur, weil das Feld existiert?
      - name: REWE -raw abrufen und zaehlen
        if: ${{ env.REWE_SECRETS_SET == 'true' }}
        env:
          CERT: ${{ steps.rewe.outputs.cert }}
          KEY: ${{ steps.rewe.outputs.key }}
          MARKET: ${{ inputs.market }}
        run: |
          set -o pipefail
          rewerse -cert "$CERT" -key "$KEY" -json discounts -market "$MARKET" -raw \
            > "$OUT/rewe_raw.json" || echo "::warning::rewerse -raw fehlgeschlagen"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["OUT"], "rewe_raw.json")
          d = json.load(open(p))
          off = d.get("data", {}).get("offers", {})
          print("defaultWeek:", off.get("defaultWeek"))
          print("nextWeekAvailableFrom:", off.get("nextWeekAvailableFrom"))
          for name in ("current", "next"):
              w = off.get(name) or {}
              cats = w.get("categories") or []
              n = sum(len(c.get("offers") or []) for c in cats)
              print(f"{name}: available={w.get('available')} "
                    f"{w.get('fromDate')}..{w.get('untilDate')} "
                    f"kategorien={len(cats)} angebote={n}")
          PY

      # ---------------------------------------------------------- Netto
      # Welche /filialangebote/<id> gibt es, und welches Datum trägt jede? Wenn
      # eine eigene ID die Folgewoche führt, ist Nettos Vorschau ein
      # Listeneintrag; wenn nicht, ist sie ein Prospekt und damit anderes Holz.
      # Über `util::curl_get`, also den **echten** Scraper-Weg samt Wiederholung
      # und Pause. Der erste Anlauf dieser Probe rief curl von Hand auf und
      # bekam von Akamai „Access Denied" — die Nightly holt Netto jede Nacht
      # erfolgreich, der Unterschied sind genau diese Wiederholungen. Eine
      # Messung, die den Weg nachbaut statt ihn zu benutzen, misst sich selbst.
      - name: Netto + ALDI SUED ueber den Scraper-Weg
        run: |
          cargo run --release --example vorschau_probe -- netto   2>&1 | tee "$OUT/netto.txt"
          cargo run --release --example vorschau_probe -- aldisued 2>&1 | tee "$OUT/aldisued.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vorschau-probe
          path: probe/
          retention-days: 3
